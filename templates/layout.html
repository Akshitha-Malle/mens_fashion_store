<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vogue Vedic | Modern Men's Fashion</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .navbar { background: white; border-bottom: 1px solid #eee; }
        .navbar-brand { font-weight: 800; color: #e32d2d !important; }
        footer { background: #1a1a1a; color: white; padding: 40px 0; margin-top: 50px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top py-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-2" href="/">VOGUE VEDIC</a>
            <input type="text" class="form-control w-25 rounded-pill" placeholder="Search...">
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer>
        <div class="container text-center">
            <p>© 2026 VOGUE VEDIC. Crafted for Perfection.</p>
        </div>
    </footer>

</body>
</html>
