<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag | Vogue Vedic</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        :root { --main-red: #e32d2d; }
        .navbar-brand { font-weight: 800; color: var(--main-red) !important; }
        .cart-item { background: white; border-radius: 20px; transition: 0.3s; }
        .cart-item:hover { shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .btn-checkout { background: var(--main-red); color: white; border-radius: 50px; padding: 15px; font-weight: 700; transition: 0.3s; }
        .btn-checkout:hover { background: #c22525; transform: translateY(-2px); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white py-3 border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand fs-3" href="/">VOGUE VEDIC</a>
        <a href="/" class="text-decoration-none text-dark fw-bold small">← CONTINUE SHOPPING</a>
    </div>
</nav>

<div class="container my-5">
    <h2 class="fw-bold mb-4">YOUR BAG <span id="item-count-title" class="text-muted fw-light"></span></h2>
    
    <div class="row g-4">
        <div class="col-lg-8" id="cart-items-container">
            </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm p-4 rounded-4 sticky-top" style="top: 100px;">
                <h5 class="fw-bold mb-4">ORDER SUMMARY</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span>Bag Total</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span>Delivery Fee</span>
                    <span class="text-success">FREE</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-4">
                    <span class="fw-bold">Total Amount</span>
                    <span class="fw-bold fs-4 text-danger" id="final-total">₹0</span>
                </div>
                <button class="btn btn-checkout w-100" onclick="checkout()">PROCEED TO CHECKOUT</button>
            </div>
        </div>
    </div>
</div>

<script>
    function renderCart() {
        const cart = JSON.parse(localStorage.getItem('vogue_cart')) || [];
        const container = document.getElementById('cart-items-container');
        const countTitle = document.getElementById('item-count-title');
        
        if (cart.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5 bg-white rounded-4 shadow-sm">
                    <h4 class="text-muted">Your bag is empty</h4>
                    <a href="/" class="btn btn-dark rounded-pill mt-3 px-4">Shop Now</a>
                </div>`;
            updateTotals(0);
            return;
        }

        countTitle.innerText = `(${cart.length} Items)`;
        let html = '';
        let total = 0;

        cart.forEach((item, index) => {
            total += item.price;
            html += `
                <div class="cart-item p-3 mb-3 shadow-sm d-flex align-items-center">
                    <img src="${item.image}" class="rounded-3" style="width: 100px; height: 120px; object-fit: contain; background: #f4f4f4;" onerror="this.src='https://assets.myntassets.com/h_144,q_100,w_108/v1/assets/images/${item.id}/${item.id}_1.jpg'">
                    <div class="ms-4 flex-grow-1">
                        <h6 class="fw-bold mb-1">${item.name}</h6>
                        <p class="text-muted small mb-2">Style ID: ${item.id}</p>
                        <h5 class="text-danger fw-bold">₹${item.price}</h5>
                    </div>
                    <button class="btn btn-light rounded-circle text-danger fw-bold" onclick="removeItem(${index})">✕</button>
                </div>`;
        });

        container.innerHTML = html;
        updateTotals(total);
    }

    function updateTotals(total) {
        document.getElementById('subtotal').innerText = `₹${total}`;
        document.getElementById('final-total').innerText = `₹${total}`;
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('vogue_cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('vogue_cart', JSON.stringify(cart));
        renderCart();
    }

    function checkout() {
        alert("Thank you for choosing Vogue Vedic! This is where you would normally enter payment details.");
        localStorage.removeItem('vogue_cart'); // Clear cart after "purchase"
        window.location.href = "/";
    }

    // Initial load
    renderCart();
</script>
</body>
</html>
